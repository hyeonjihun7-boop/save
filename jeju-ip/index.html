<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>제주이야기 · Jeju IP 갤러리</title>
  <meta name="description" content="한라산, 해녀, 돌하르방, 감귤… 제주의 상징(IP)을 사진으로 만나고 즐겨찾기하는 사이트" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍊%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="nav">
    <a class="logo" href="/" aria-label="제주이야기 홈">🍊 제주이야기</a>
    <nav class="tabs">
      <button class="tab active" data-view="home">갤러리</button>
      <button class="tab" data-view="favs">❤ 내 즐겨찾기</button>
    </nav>
    <div id="authBox" class="authbox"></div>
  </header>

  <div id="envBanner" class="banner hidden"></div>

  <section class="hero">
    <div class="hero-inner">
      <p class="eyebrow">JEJU ISLAND · IP GALLERY</p>
      <h1>바람, 돌, 바다, 그리고 감귤<span>제주를 상징하는 이야기들을 사진으로 만나요</span></h1>
      <p class="hero-sub">회원가입하고 마음에 드는 장면을 <b>❤ 즐겨찾기</b>로 모아 보세요.</p>
    </div>
    <svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,64 C240,120 480,0 720,48 C960,96 1200,16 1440,64 L1440,120 L0,120 Z" fill="var(--bg)"></path>
    </svg>
  </section>

  <main class="wrap">
    <div id="homeView">
      <div id="chips" class="chips"></div>
      <form id="searchForm" class="search">
        <input id="q" type="search" placeholder="직접 검색 (예: Jeju waterfall, 영어가 더 잘 나와요)" autocomplete="off" />
        <button type="submit">검색</button>
      </form>
      <p id="status" class="status"></p>
      <div id="grid" class="grid"></div>
      <div class="more-wrap"><button id="more" class="more hidden">더 보기</button></div>
    </div>

    <div id="favsView" class="hidden">
      <h2 class="sec-title">❤ 내 즐겨찾기</h2>
      <p id="favStatus" class="status"></p>
      <div id="favGrid" class="grid"></div>
    </div>
  </main>

  <footer class="foot">
    사진 출처 <a href="https://pixabay.com" target="_blank" rel="noopener">Pixabay</a> · 인증·데이터 <a href="https://supabase.com" target="_blank" rel="noopener">Supabase</a> · 배포 Vercel
  </footer>

  <!-- 로그인 / 회원가입 -->
  <dialog id="authDlg" class="dlg">
    <form id="authForm" method="dialog" class="auth" novalidate>
      <button type="button" class="x" data-close aria-label="닫기">✕</button>
      <h2 id="authTitle">로그인</h2>
      <div class="seg">
        <button type="button" data-mode="login" class="on">로그인</button>
        <button type="button" data-mode="signup">회원가입</button>
      </div>
      <p id="authNote" class="note hidden"></p>
      <label class="field signup-only hidden">닉네임<input id="nick" type="text" maxlength="20" placeholder="예: 한라산지킴이" autocomplete="nickname" /></label>
      <label class="field">이메일<input id="email" type="email" required placeholder="you@example.com" autocomplete="email" /></label>
      <label class="field">비밀번호<input id="pw" type="password" required minlength="6" placeholder="6자 이상" autocomplete="current-password" /></label>
      <p id="authMsg" class="msg" role="alert"></p>
      <button id="authSubmit" class="primary" type="submit">로그인</button>
    </form>
  </dialog>

  <!-- 이미지 크게 보기 -->
  <dialog id="viewDlg" class="dlg view">
    <button type="button" class="x" data-close aria-label="닫기">✕</button>
    <div id="viewBody"></div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
