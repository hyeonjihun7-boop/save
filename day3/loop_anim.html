<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for...of 반복문 애니메이션</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; background: #f8fafc; color: #1e293b; }
        h1 { font-size: 20px; margin: 0 0 12px; }
        .layout { display: flex; gap: 16px; flex-wrap: wrap; }
        .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; }
        #codeBox { flex: 1 1 320px; }
        #stage { flex: 2 1 420px; }
        pre { margin: 0; font-size: 15px; line-height: 1.9; font-family: Consolas, monospace; }
        .ln { display: block; padding: 0 8px; border-radius: 6px; border-left: 4px solid transparent; transition: background .3s; }
        .ln.on { background: #fef08a; border-left-color: #eab308; }
        .row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
        .label { width: 90px; font-size: 13px; color: #64748b; }
        .box { min-width: 56px; height: 48px; padding: 0 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; border: 2px solid #94a3b8; border-radius: 10px; background: #fff; transition: all .4s; }
        .box.cur { background: #38bdf8; border-color: #0369a1; color: #fff; transform: translateY(-8px) scale(1.1); }
        .box.done { background: #e2e8f0; color: #94a3b8; }
        .hidden { opacity: 0; transform: scale(.6); }
        .machine { padding: 10px 14px; border-radius: 12px; background: #ede9fe; border: 2px solid #7c3aed; font-family: Consolas, monospace; font-size: 15px; }
        .arrow { font-size: 22px; color: #64748b; }
        .pop { animation: pop .5s; }
        @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); background: #bbf7d0; } 100% { transform: scale(1); } }
        #sum { border-color: #16a34a; }
        #console { background: #0f172a; color: #4ade80; font-family: Consolas, monospace; border-radius: 10px; padding: 10px 14px; min-height: 44px; }
        #desc { margin: 4px 0 14px; padding: 12px 14px; border-radius: 10px; background: #e0f2fe; min-height: 56px; line-height: 1.6; }
        .ctrl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
        button { padding: 8px 16px; font-size: 15px; border: 0; border-radius: 8px; background: #0369a1; color: #fff; cursor: pointer; }
        button.sub { background: #64748b; }
        button:disabled { opacity: .4; cursor: default; }
        #stepNo { margin-left: auto; font-size: 13px; color: #64748b; }
    </style>
</head>
<body>
    <h1>for...of 반복문과 함수 — 한 단계씩 보기</h1>
    <div class="layout">
        <div class="panel" id="codeBox">
            <pre><span class="ln" data-l="1">const f = (i) =&gt; i*3</span><span class="ln" data-l="2">let arr = [10,20,30]</span><span class="ln" data-l="3">let sum = 0</span><span class="ln" data-l="4">for (const v of arr) {</span><span class="ln" data-l="5">    sum = sum + f(v)</span><span class="ln" data-l="6">}</span><span class="ln" data-l="7">console.log(sum)</span></pre>
            <p style="font-size:12px;color:#64748b;margin:10px 0 0">※ 처음 코드의 <code>const f(i)</code> 는 문법 오류입니다. 함수는 <code>const f = (i) =&gt; ...</code> 처럼 <b>=</b> 가 있어야 합니다.</p>
        </div>
        <div class="panel" id="stage">
            <div id="desc"></div>
            <div class="row">
                <span class="label">함수 f</span>
                <div class="machine" id="machine">f(i) = i × 3</div>
                <span id="calc" style="font-family:Consolas,monospace"></span>
            </div>
            <div class="row">
                <span class="label">arr 배열</span>
                <div id="arr" style="display:flex;gap:8px"></div>
            </div>
            <div class="row">
                <span class="label">v (꺼낸 값)</span>
                <div class="box" id="v">-</div>
            </div>
            <div class="row">
                <span class="label">sum (합계)</span>
                <div class="box" id="sum">0</div>
            </div>
            <div class="row">
                <span class="label">콘솔 출력</span>
                <div id="console" style="flex:1">&nbsp;</div>
            </div>
        </div>
    </div>
    <div class="ctrl">
        <button id="prev" class="sub">◀ 이전</button>
        <button id="next">다음 ▶</button>
        <button id="auto" class="sub">▶ 자동 재생</button>
        <button id="reset" class="sub">처음으로</button>
        <span id="stepNo"></span>
    </div>

    <script>
        const ARR = [10, 20, 30]
        const f = (i) => i * 3

        // 코드를 실제로 돌려 보면서 "한 단계씩" 상태를 기록해 둔다
        const steps = []
        let sum = 0
        steps.push({ line: 1, text: '함수 f 를 만들어 둡니다. 받은 값에 3을 곱해 돌려주는 기능이고, 아직 실행되지는 않아요.', idx: -1, v: '-', calc: '', sum, out: '' })
        steps.push({ line: 2, text: '배열 arr 에 숫자 3개를 담습니다: 10, 20, 30', idx: -1, v: '-', calc: '', sum, out: '' })
        steps.push({ line: 3, text: '합계를 저장할 변수 sum 을 0으로 시작합니다.', idx: -1, v: '-', calc: '', sum, out: '' })
        ARR.forEach((value, i) => {
            const r = f(value)
            steps.push({ line: 4, text: 'for...of : arr 에서 ' + (i + 1) + '번째 값을 꺼내 v 에 담습니다. v = ' + value, idx: i, v: value, calc: '', sum, out: '' })
            steps.push({ line: 5, text: '먼저 f(v) 를 실행합니다. f(' + value + ') = ' + value + ' × 3 = ' + r, idx: i, v: value, calc: 'f(' + value + ') = ' + r, sum, out: '' })
            const before = sum
            sum = sum + r
            steps.push({ line: 5, text: 'sum = sum + f(v) → ' + before + ' + ' + r + ' = ' + sum + '  (sum 이 ' + sum + ' 으로 바뀝니다)', idx: i, v: value, calc: 'f(' + value + ') = ' + r, sum, out: '', pop: true })
        })
        steps.push({ line: 6, text: 'arr 에 더 꺼낼 값이 없으므로 반복(for)이 끝납니다.', idx: -2, v: '-', calc: '', sum, out: '' })
        steps.push({ line: 7, text: 'console.log(sum) → 콘솔에 최종 합계 ' + sum + ' 이(가) 출력됩니다.', idx: -2, v: '-', calc: '', sum, out: String(sum), pop: true })

        const $ = (id) => document.getElementById(id)
        let now = 0
        let timer = null

        function render() {
            const s = steps[now]
            document.querySelectorAll('.ln').forEach((el) => el.classList.toggle('on', Number(el.dataset.l) === s.line))
            $('desc').textContent = s.text
            $('calc').textContent = s.calc ? '→ ' + s.calc : ''

            const arr = $('arr')
            arr.innerHTML = ''
            ARR.forEach((n, i) => {
                const b = document.createElement('div')
                b.className = 'box' + (i === s.idx ? ' cur' : '') + (s.idx === -2 || (s.idx >= 0 && i < s.idx) ? ' done' : '')
                b.textContent = n
                arr.appendChild(b)
            })

            $('v').textContent = s.v
            $('v').className = 'box' + (s.idx >= 0 ? ' cur' : '')

            const sumEl = $('sum')
            const changed = sumEl.textContent !== String(s.sum)
            sumEl.textContent = s.sum
            sumEl.classList.remove('pop')
            if (changed) { void sumEl.offsetWidth; sumEl.classList.add('pop') }

            $('console').textContent = s.out ? '> ' + s.out : ' '
            $('stepNo').textContent = '단계 ' + (now + 1) + ' / ' + steps.length
            $('prev').disabled = now === 0
            $('next').disabled = now === steps.length - 1
        }

        function go(n) { now = Math.max(0, Math.min(steps.length - 1, n)); render() }
        function stopAuto() { clearInterval(timer); timer = null; $('auto').textContent = '▶ 자동 재생' }

        $('next').onclick = () => { stopAuto(); go(now + 1) }
        $('prev').onclick = () => { stopAuto(); go(now - 1) }
        $('reset').onclick = () => { stopAuto(); go(0) }
        $('auto').onclick = () => {
            if (timer) return stopAuto()
            if (now === steps.length - 1) go(0)
            $('auto').textContent = '⏸ 멈춤'
            timer = setInterval(() => {
                if (now >= steps.length - 1) return stopAuto()
                go(now + 1)
            }, 1800)
        }

        render()
    </script>
</body>
</html>
