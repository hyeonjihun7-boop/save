<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const f= (i) =>{//i변수에는 객체가 온다    {"a:10"}
         console.log(i) //함수(기능) , 기능함수 정의 (만들다)
            return i.a*10
        }
        //사용하는쪽에서 호출(call) => 실행
        let u= f("a:10")// 변수 u에는 객체가 저장되어 있다
        let a= f(u)
        console.log(a)
    </script>
</body>
