<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // ① 함수 정의 (기능을 "만들어 두기"만 한다. 아직 실행되지 않는다)
        //    f 라는 이름의 함수이고, 화살표(=>)로 만든다.
        //    ( { a, b, z } ) : 객체 하나를 받아서 그 안의 a, b, z 값을 바로 꺼내 쓴다 (구조분해)
        //    예) 객체 {"a":10, "b":1000, "z":3} 가 들어오면 a=10, b=1000, z=3 이 된다
        const f= ( { a, b ,z }) => {//i변수에는 객체가 온다    {"a:10"}
         //console.log(i) //함수(기능) , 기능함수 정의 (만들다)
            // 꺼낸 값을 계산해서 돌려준다 (return = 결과를 밖으로 내보낸다)
            // 10 * 10 * 1000 * 3 = 300000
            return a*10*b*z
        }

        // ② 호출(call) = 실행 : 만들어 둔 함수를 "사용하는 쪽"에서 불러서 일을 시킨다
        //사용하는쪽에서 호출(call) => 실행
        // 변수 u 에는 객체(키:값 묶음)가 저장되어 있다
        let u= {"a":10,"b":1000,"z":3}// 변수 u에는 객체가 저장되어 있다

        // u 를 함수 f 에 넣어(f(u)) 실행하고, 돌아온 결과(300000)를 변수 a 에 저장한다
        // (함수 안의 a 와 이 바깥의 a 는 서로 다른 변수다)
        let a= f(u)

        // 브라우저 개발자 도구(F12) 콘솔에 300000 이 출력된다
        console.log(a)
    </script>
</body>
</html>
