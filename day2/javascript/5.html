<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function plus(a,b){
            return a+b
        }
        function subtraction(a,b){
            return a-b
        }
        function multiply(a,b){
            return a*b
        }
        function divide(a,b){
            return a/b
        }
    window.addEventListener('DOMContentLoaded', function () {
        document.querySelector('button#a').addEventListener('click',() => {
            const x = Number(document.querySelector('#x').value)
            const y = Number(document.querySelector('#y').value)
            document.querySelector('#result').textContent = plus(x, y)
        });
        document.querySelector('button#b').addEventListener('click',() => {
            const x = Number(document.querySelector('#x').value)
            const y = Number(document.querySelector('#y').value)
            document.querySelector('#result').textContent = subtraction(x, y)
        });
        document.querySelector('button#c').addEventListener('click',() => {
            const x = Number(document.querySelector('#x').value)
            const y = Number(document.querySelector('#y').value)
            document.querySelector('#result').textContent = multiply(x, y)
        });
        document.querySelector('button#d').addEventListener('click',() => {
            const x = Number(document.querySelector('#x').value)
            const y = Number(document.querySelector('#y').value)
            document.querySelector('#result').textContent = divide(x, y)
        });

    }
)


    </script>
</head>
<body>
    안녕하세요
    <h1>
        반갑습니다
    </h1>
    <h2>
        반갑습니다
    </h2>
    <input type="number" id="x" placeholder="첫 번째 숫자">
    <input type="number" id="y" placeholder="두 번째 숫자">
    <button id="a">더하기</button>
    <button id="b">빼기</button>
    <button id="c">곱하기</button>
    <button id="d">나누기</button>
    <h2>결과: <span id="result"></span></h2>
</body>
</html>
